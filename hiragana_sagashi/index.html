<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ひらがなさがし</title>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-bg: #f2f2f7;
            --ios-text: #000;
            --selected-bg: #007AFF;
            --selected-text: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Klee One', serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background-color: #fff;
        }

        /* --- ホーム画面 --- */
        #home-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--ios-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        #home-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .ios-btn {
            width: 220px;
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: transform 0.1s ease;
        }

        .ios-btn:active { transform: scale(0.95); }

        #start-btn { background-color: var(--ios-blue); color: white; }
        #settings-btn-home { background-color: #e5e5ea; color: #333; font-size: 18px; width: 180px; padding: 12px; }
        .hint-text { font-size: 12px; color: #8e8e93; margin-top: 8px; }

        /* --- ゲーム画面 --- */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: white;
            overflow: hidden;
        }

        #target-box {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 160px;
            height: 160px;
            background-color: #eee;
            border: 6px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            color: black;
            z-index: 10;
        }

        .char-node {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 5;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* --- モーダル (設定シート) --- */
        #setting-sheet {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            padding: 25px;
            border: 3px solid black;
            border-radius: 25px;
            z-index: 200;
            display: none;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
            overflow-y: auto;
        }

        #setting-sheet.active { display: flex; }

        .setting-item { display: flex; flex-direction: column; gap: 5px; }
        .slider-row { flex-direction: row; align-items: center; justify-content: space-between; }
        
        /* 文字選択リストのビジュアル改善 */
        #char-selection-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
            gap: 8px;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 10px;
            max-height: 180px;
            overflow-y: auto;
            margin-top: 5px;
        }
        .char-checkbox {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 1px solid #ddd;
            border-radius: 8px;
            aspect-ratio: 1/1;
            cursor: pointer;
            background: #fff;
            transition: all 0.2s;
        }

        /* 選択された時の色 */
        .char-checkbox.selected {
            background-color: var(--selected-bg);
            color: var(--selected-text);
            border-color: var(--selected-bg);
        }

        #close-btn {
            margin-top: 10px;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #eee;
            font-size: 18px;
            cursor: pointer;
        }

        .action-btn {
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: var(--ios-blue);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body oncontextmenu="return false;">

<!-- ホーム画面 -->
<div id="home-screen">
    <div class="btn-container">
        <button id="start-btn" class="ios-btn">スタート</button>
        <div style="display: flex; flex-direction: column; align-items: center;">
            <button id="settings-btn-home" class="ios-btn">設定</button>
            <span class="hint-text">※トリプルタップ</span>
        </div>
    </div>
</div>

<!-- ゲーム画面 -->
<div id="game-container">
    <div id="target-box"></div>
    <div id="character-layer"></div>
</div>

<!-- 設定シート -->
<div id="setting-sheet">
    <div class="setting-item slider-row">
        <label>文字の数</label>
        <input type="range" id="num-slider" min="1" max="50" value="10">
        <span id="slider-val">10</span>
    </div>

    <div class="setting-item">
        <label>使用する文字を選択</label>
        <div id="char-selection-list"></div>
    </div>

    <div class="setting-item slider-row">
        <label>ホームに戻るを許可</label>
        <input type="checkbox" id="allow-home-toggle" checked>
    </div>

    <button id="return-home-btn" class="action-btn">ホームへ戻る</button>
    <button id="close-btn">閉じる</button>
</div>

<script>
    const allImages = ["あ", "い", "う", "え", "お", "か", "き", "く", "け", "こ", "さ", "し", "す", "せ", "そ", "た", "ち", "つ", "て", "と", "な", "に", "ぬ", "ね", "の", "は", "ひ", "ふ", "へ", "ほ", "ま", "み", "む", "め", "も", "や", "ゆ", "よ", "ら", "り", "る", "れ", "ろ", "わ", "を", "ゃ", "ゅ", "ょ", "っ", "ん", "が", "ぎ", "ぐ", "げ", "ご", "ざ", "じ", "ず", "ぜ", "ぞ", "だ", "ぢ", "づ", "で", "ど", "ば", "び", "ぶ", "べ", "ぼ", "ぱ", "ぴ", "ぷ", "ぺ", "ぽ"];
    
    let selectedChars = [...allImages];
    let numOfImages = 10;
    let targetChar = "";
    
    const homeScreen = document.getElementById('home-screen');
    const container = document.getElementById('game-container');
    const charLayer = document.getElementById('character-layer');
    const targetBox = document.getElementById('target-box');
    const slider = document.getElementById('num-slider');
    const sliderVal = document.getElementById('slider-val');
    const settingSheet = document.getElementById('setting-sheet');
    const startBtn = document.getElementById('start-btn');
    const settingsBtnHome = document.getElementById('settings-btn-home');
    const charListContainer = document.getElementById('char-selection-list');
    const allowHomeToggle = document.getElementById('allow-home-toggle');
    const returnHomeBtn = document.getElementById('return-home-btn');
    const closeBtn = document.getElementById('close-btn');

    const synth = window.speechSynthesis;

    // --- 音声 & 効果音 ---
    function speak(text) {
        if (synth.speaking) synth.cancel();
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        uttr.rate = 1.2;
        synth.speak(uttr);
    }

    function playSuccessSound() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(880.00, audioCtx.currentTime + 0.2);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.3);
    }

    // --- 初期設定: 文字リストの生成 ---
    function initCharSelection() {
        charListContainer.innerHTML = "";
        allImages.forEach(char => {
            const label = document.createElement('label');
            label.className = 'char-checkbox';
            if (selectedChars.includes(char)) {
                label.classList.add('selected');
            }
            
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.style.display = 'none';
            cb.checked = selectedChars.includes(char);
            
            cb.onchange = (e) => {
                if (e.target.checked) {
                    if (!selectedChars.includes(char)) selectedChars.push(char);
                    label.classList.add('selected');
                } else {
                    selectedChars = selectedChars.filter(c => c !== char);
                    label.classList.remove('selected');
                }
            };
            
            label.appendChild(cb);
            const textNode = document.createTextNode(char);
            label.appendChild(textNode);
            charListContainer.appendChild(label);
        });
    }

    // --- トリプルタップ判定 ---
    let tapCount = 0;
    let tapTimer;
    settingsBtnHome.addEventListener('pointerdown', (e) => {
        tapCount++;
        clearTimeout(tapTimer);
        tapTimer = setTimeout(() => { tapCount = 0; }, 400);
        if (tapCount === 3) {
            tapCount = 0;
            settingSheet.classList.add('active');
        }
    });

    // --- ゲームロジック ---
    function initGame() {
        if (selectedChars.length === 0) {
            alert("文字を少なくとも1つ選択してください");
            return;
        }
        homeScreen.classList.add('hidden');
        charLayer.innerHTML = "";
        let shuffled = [...selectedChars].sort(() => 0.5 - Math.random());
        targetChar = shuffled[0];
        targetBox.innerText = targetChar;
        speak(targetChar);
        spawnCharacters(shuffled);
    }

    function spawnCharacters(shuffledList) {
        charLayer.innerHTML = "";
        const num = Math.min(numOfImages, shuffledList.length);
        const containerW = container.clientWidth;
        const containerH = container.clientHeight;
        const margin = 40;

        let cols = Math.ceil(Math.sqrt(num * 1.5)); 
        let rows = Math.ceil(num / cols);
        const cellW = (containerW - margin * 2) / cols;
        const cellH = (containerH - margin * 2) / rows;
        const fontSize = Math.min(cellW, cellH) * 0.7;

        let availableCells = [];
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                availableCells.push({r, c});
            }
        }
        availableCells.sort(() => Math.random() - 0.5);

        const tRect = targetBox.getBoundingClientRect();
        let placedCount = 0;

        for (let i = 0; i < availableCells.length; i++) {
            if (placedCount >= num) break;
            const {r, c} = availableCells[i];
            let x = margin + c * cellW + (cellW - fontSize) / 2;
            let y = margin + r * cellH + (cellH - fontSize) / 2;
            x += (Math.random() - 0.5) * (cellW * 0.4);
            y += (Math.random() - 0.5) * (cellH * 0.4);

            const collision = !(x + fontSize < tRect.left || x > tRect.right || y + fontSize < tRect.top || y > tRect.bottom);
            if (collision) continue;

            const char = shuffledList[placedCount];
            const node = document.createElement('div');
            node.className = 'char-node';
            node.innerText = char;
            node.style.fontSize = fontSize + 'px';
            node.style.left = x + 'px';
            node.style.top = y + 'px';
            node.dataset.char = char;
            
            node.onclick = () => handleTap(node);
            charLayer.appendChild(node);
            placedCount++;
        }
    }

    function handleTap(node) {
        const clickedChar = node.dataset.char;
        speak(clickedChar);

        if (clickedChar === targetChar) {
            node.style.color = "red";
            node.style.transform = "scale(2)";
            playSuccessSound();
            setTimeout(() => { initGame(); }, 600);
        } else {
            node.style.opacity = "0";
            setTimeout(() => { node.remove(); }, 200);
        }
    }

    // --- イベントリスナー ---
    startBtn.onclick = () => initGame();
    closeBtn.onclick = () => settingSheet.classList.remove('active');
    
    returnHomeBtn.onclick = () => {
        if (allowHomeToggle.checked) {
            homeScreen.classList.remove('hidden');
            settingSheet.classList.remove('active');
        } else {
            settingSheet.classList.remove('active');
        }
    };

    slider.oninput = (e) => {
        numOfImages = parseInt(e.target.value);
        sliderVal.innerText = numOfImages;
        if (!homeScreen.classList.contains('hidden')) initGame(); 
    };

    window.onload = () => {
        initCharSelection();
    };
</script>

</body>
</html>
