<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>点タップ</title>
  
  <!-- ホーム画面追加時のアイコンとアプリ化設定 -->
  <link rel="apple-touch-icon" href="img.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    /* iOSバグ対策と基本変数 */
    :root {
      --vh: 1vh;
      --primary-color: #007aff;
      --target-color: #ff3b30;
      --dot-color: #333333;
      --bg-color: #ffffff;
      --setting-bg: #f2f2f7;
    }
    
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: calc(var(--vh, 1vh) * 100);
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
      touch-action: none;
    }

    /* 画面切り替え用のコンテナ */
    .screen {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      position: relative;
    }
    .screen.active {
      display: flex;
    }

    /* ホーム画面 */
    #home-screen {
      justify-content: center;
      align-items: center;
      gap: 30px;
    }
    .app-title {
      font-size: 2.5rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 20px;
    }
    .btn-primary {
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 1.5rem;
      font-weight: bold;
      width: 240px;
      padding: 20px 0;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      cursor: pointer;
    }
    .btn-secondary {
      background-color: #e5e5ea;
      color: #333;
      border: none;
      border-radius: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      width: 240px;
      padding: 15px 0;
      cursor: pointer;
    }

    /* 設定画面 */
    #setting-screen {
      background-color: var(--setting-bg);
      touch-action: auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .setting-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background-color: #fff;
      border-bottom: 1px solid #c6c6c8;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .setting-header h2 {
      margin: 0;
      font-size: 1.2rem;
    }
    .setting-close-btn {
      color: var(--primary-color);
      font-size: 1.1rem;
      font-weight: bold;
      background: none;
      border: none;
      padding: 10px;
      cursor: pointer;
    }
    .setting-group {
      background-color: #fff;
      margin-top: 20px;
      border-top: 1px solid #c6c6c8;
      border-bottom: 1px solid #c6c6c8;
    }
    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      border-bottom: 1px solid #e5e5ea;
      font-size: 1.1rem;
    }
    .setting-item:last-child {
      border-bottom: none;
    }
    .setting-input {
      font-size: 1.1rem;
      width: 60px;
      text-align: right;
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .range-slider {
      width: 140px;
      accent-color: var(--primary-color);
    }
    
    /* トグルスイッチ */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 30px;
    }
    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 30px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #34c759; }
    input:checked + .slider:before { transform: translateX(20px); }

    /* プレイ画面 */
    #play-screen {
      background-color: var(--bg-color);
    }
    .play-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 15px 20px;
      z-index: 100;
      pointer-events: none;
    }
    .home-btn {
      background-color: rgba(242, 242, 247, 0.9);
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #555;
      pointer-events: auto;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .status-text {
      font-size: 1.2rem;
      font-weight: bold;
      color: #333;
    }
    #status-time {
      color: rgba(163, 163, 163, 0.8);
      font-size: 1.2rem;
      font-weight: normal;
      margin-top: 10px;
      pointer-events: none;
    }

    .play-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    .dot-grid {
      display: grid;
      justify-items: center;
      align-items: center;
    }

    .dot-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .circle {
      width: var(--circle-size, 40px);
      height: var(--circle-size, 40px);
      border-radius: 50%;
      background-color: var(--dot-color);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: calc(var(--circle-size, 40px) * 0.4);
      font-weight: bold;
      transition: background-color 0.1s, transform 0.1s;
    }

    /* ターゲットのスタイル */
    .circle.target {
      background-color: var(--target-color);
      transform: scale(1.1);
    }

    /* 紙吹雪風の弾ける演出アニメーション */
    @keyframes confetti-burst {
      0% {
        transform: translate(0, 0) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1.1);
        opacity: 1;
      }
      80% {
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(var(--rz)) scale(0.5);
        opacity: 0;
      }
    }
    .confetti-particle {
      position: absolute;
      pointer-events: none;
      z-index: 60;
      animation: confetti-burst 0.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }
  </style>
</head>
<body>

  <!-- ホーム画面 -->
  <div id="home-screen" class="screen active">
    <div class="app-title">点タップ</div>
    <button id="btn-start" class="btn-primary">スタート</button>
    <button id="btn-setting" class="btn-secondary">設定（トリプルタップ）</button>
  </div>

  <!-- 設定画面 -->
  <div id="setting-screen" class="screen">
    <div class="setting-header">
      <h2>設定</h2>
      <button class="setting-close-btn" id="btn-setting-close">完了</button>
    </div>
    <div class="setting-group">
      <div class="setting-item">
        <span>縦の数</span>
        <input type="number" id="input-rows" class="setting-input" min="2" max="15" value="7">
      </div>
      <div class="setting-item">
        <span>横の数</span>
        <input type="number" id="input-cols" class="setting-input" min="2" max="15" value="7">
      </div>
      <div class="setting-item">
        <span>タップ回数</span>
        <div style="display: flex; align-items: center; gap: 10px;">
          <input type="range" id="input-target-count" class="range-slider" min="1" max="49" value="49">
          <span id="target-count-val" style="min-width: 35px; text-align: right; font-weight: bold;">49回</span>
        </div>
      </div>
      <div class="setting-item">
        <span>数字を表示する</span>
        <label class="switch">
          <input type="checkbox" id="input-show-number" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-item">
        <span>タップ時の演出</span>
        <label class="switch">
          <input type="checkbox" id="input-show-effect" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-item">
        <span>ホームボタンを表示</span>
        <label class="switch">
          <input type="checkbox" id="input-show-home-btn">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- プレイ画面 -->
  <div id="play-screen" class="screen">
    <div class="play-header">
      <button class="home-btn" id="btn-home">🏠</button>
      <div class="status-text" id="status-time">0分0秒</div>
    </div>
    <div class="play-area" id="play-area">
      <div id="dot-grid" class="dot-grid"></div>
    </div>
  </div>

  <script>
    // --- 状態管理・設定 ---
    let numOfRows = 7;
    let numOfCols = 7;
    let targetCount = 49;
    let showNumber = true;
    let showEffect = true;
    let showHomeBtn = false;
    
    let orders = [];
    let startTime = null;
    let timerId = null;

    // --- グリッドの動的サイズ計算 ---
    function adjustGrid() {
      const playArea = document.querySelector('.play-area');
      const grid = document.getElementById('dot-grid');
      if (!playArea || !grid) return;

      const style = window.getComputedStyle(playArea);
      const availableWidth = playArea.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
      const availableHeight = playArea.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);

      const cellSize = Math.min(availableWidth / numOfCols, availableHeight / numOfRows);

      grid.style.width = `${cellSize * numOfCols}px`;
      grid.style.height = `${cellSize * numOfRows}px`;
      
      const circleSize = Math.max(cellSize * 0.65, 10);
      grid.style.setProperty('--circle-size', `${circleSize}px`);
    }

    // --- 画面高さ(vh)のリアルタイム計算（iOS Safari対策） ---
    function setAppHeight() {
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
      adjustGrid();
    }
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', () => setTimeout(setAppHeight, 100));
    setAppHeight();

    // --- カラフルな紙吹雪風タップ演出（サイズを2倍に拡大） ---
    function triggerBurstEffect(x, y) {
      const playArea = document.getElementById('play-area');
      const particleCount = 28;
      const colors = [
        '#ff3b30', '#ff9500', '#ffcc00', '#34c759', '#00c7be',
        '#30b0c7', '#007aff', '#5856d6', '#af52de', '#ff2d55'
      ];
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'confetti-particle';
        
        // 紙吹雪チップ（長方形・正方形・丸）のサイズを従来の2倍に設定
        const shapeType = Math.random();
        let width, height, borderRadius;
        
        if (shapeType < 0.5) {
          // 長方形の紙吹雪チップ (倍サイズ: 12〜24px × 16〜36px)
          width = Math.random() * 12 + 12;
          height = Math.random() * 20 + 16;
          borderRadius = '3px';
        } else if (shapeType < 0.8) {
          // 正方形チップ (倍サイズ: 12〜26px)
          width = Math.random() * 14 + 12;
          height = width;
          borderRadius = '3px';
        } else {
          // 丸いスパンコール (倍サイズ: 直径10〜24px)
          width = Math.random() * 14 + 10;
          height = width;
          borderRadius = '50%';
        }
        
        particle.style.width = `${width}px`;
        particle.style.height = `${height}px`;
        particle.style.borderRadius = borderRadius;
        particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        
        particle.style.left = `${x - width / 2}px`;
        particle.style.top = `${y - height / 2}px`;
        
        // 飛び散る距離もチップの大きさに合わせてやや広めに調整
        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 75 + 45;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance - (Math.random() * 20);
        
        // 3D回転
        const rx = `${Math.random() * 720 - 360}deg`;
        const ry = `${Math.random() * 720 - 360}deg`;
        const rz = `${Math.random() * 720 - 360}deg`;
        
        particle.style.setProperty('--tx', `${tx}px`);
        particle.style.setProperty('--ty', `${ty}px`);
        particle.style.setProperty('--rx', rx);
        particle.style.setProperty('--ry', ry);
        particle.style.setProperty('--rz', rz);
        
        playArea.appendChild(particle);
        
        setTimeout(() => {
          particle.remove();
        }, 500);
      }
    }

    // --- 音声・サウンド管理 (Web Audio API & Speech API) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = new AudioContext();

    function unlockAudio() {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      gain.gain.value = 0;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.01);

      window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance('');
      ut.volume = 0;
      window.speechSynthesis.speak(ut);
    }

    function playClickSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    function playCorrectSound() {
      if (!audioCtx) return;
      const playTone = (freq, startTime, duration) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.5, startTime);
        gain.gain.linearRampToValueAtTime(0, startTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration);
      };
      
      const now = audioCtx.currentTime;
      playTone(880, now, 0.3);
      playTone(1046.50, now + 0.15, 0.4);
    }

    function speechWord(word) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(String(word));
      utterance.lang = "ja-JP";
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    // スライダーの最大値と表示の更新
    function updateTargetCountRange() {
      const rows = parseInt(document.getElementById('input-rows').value, 10) || 7;
      const cols = parseInt(document.getElementById('input-cols').value, 10) || 7;
      const maxVal = rows * cols;
      const slider = document.getElementById('input-target-count');
      const valDisplay = document.getElementById('target-count-val');
      
      slider.max = maxVal;
      if (parseInt(slider.value, 10) > maxVal) {
        slider.value = maxVal;
      }
      valDisplay.textContent = `${slider.value}回`;
    }

    // LocalStorageからの読み込み
    function loadSettings() {
      const savedRows = localStorage.getItem('dot_numOfRows');
      const savedCols = localStorage.getItem('dot_numOfCols');
      const savedTargetCount = localStorage.getItem('dot_targetCount');
      const savedShow = localStorage.getItem('dot_showNumber');
      const savedEffect = localStorage.getItem('dot_showEffect');
      const savedShowHome = localStorage.getItem('dot_showHomeBtn');
      
      if (savedRows) numOfRows = parseInt(savedRows, 10);
      if (savedCols) numOfCols = parseInt(savedCols, 10);
      targetCount = savedTargetCount ? parseInt(savedTargetCount, 10) : (numOfRows * numOfCols);
      if (savedShow) showNumber = (savedShow === 'true');
      if (savedEffect) showEffect = (savedEffect === 'true');
      if (savedShowHome) showHomeBtn = (savedShowHome === 'true');

      document.getElementById('input-rows').value = numOfRows;
      document.getElementById('input-cols').value = numOfCols;
      
      updateTargetCountRange();
      document.getElementById('input-target-count').value = Math.min(targetCount, numOfRows * numOfCols);
      document.getElementById('target-count-val').textContent = `${document.getElementById('input-target-count').value}回`;
      
      document.getElementById('input-show-number').checked = showNumber;
      document.getElementById('input-show-effect').checked = showEffect;
      document.getElementById('input-show-home-btn').checked = showHomeBtn;
    }

    // LocalStorageへの保存
    function saveSettings() {
      numOfRows = parseInt(document.getElementById('input-rows').value, 10) || 7;
      numOfCols = parseInt(document.getElementById('input-cols').value, 10) || 7;
      targetCount = parseInt(document.getElementById('input-target-count').value, 10) || (numOfRows * numOfCols);
      showNumber = document.getElementById('input-show-number').checked;
      showEffect = document.getElementById('input-show-effect').checked;
      showHomeBtn = document.getElementById('input-show-home-btn').checked;
      
      localStorage.setItem('dot_numOfRows', numOfRows);
      localStorage.setItem('dot_numOfCols', numOfCols);
      localStorage.setItem('dot_targetCount', targetCount);
      localStorage.setItem('dot_showNumber', showNumber);
      localStorage.setItem('dot_showEffect', showEffect);
      localStorage.setItem('dot_showHomeBtn', showHomeBtn);
    }

    // --- 画面遷移制御 ---
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      if (screenId === 'play-screen') {
        setTimeout(adjustGrid, 10); 
      }
    }

    // --- タイマー処理 ---
    function updateTime() {
      if (!startTime) {
        document.getElementById('status-time').textContent = '0分0秒';
        return;
      }
      const now = new Date();
      const intervalSec = Math.floor((now - startTime) / 1000);
      const min = Math.floor(intervalSec / 60);
      const sec = intervalSec % 60;
      document.getElementById('status-time').textContent = `${min}分${sec}秒`;
    }

    function startTimer() {
      if (timerId) clearInterval(timerId);
      timerId = setInterval(updateTime, 1000);
    }

    function stopTimer() {
      if (timerId) clearInterval(timerId);
      timerId = null;
    }

    // --- ゲームロジック ---
    function initGame() {
      const grid = document.getElementById('dot-grid');
      grid.style.gridTemplateColumns = `repeat(${numOfCols}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${numOfRows}, 1fr)`;
      grid.innerHTML = '';
      
      adjustGrid();

      const totalDots = numOfRows * numOfCols;
      const allIndices = [];
      for (let i = 0; i < totalDots; i++) {
        allIndices.push(i);
      }
      allIndices.sort(() => Math.random() - 0.5);
      
      const currentTargetCount = Math.min(targetCount, totalDots);
      orders = allIndices.slice(0, currentTargetCount);
      
      startTime = null;
      stopTimer();
      updateTime();

      document.getElementById('btn-home').style.visibility = showHomeBtn ? 'visible' : 'hidden';

      for (let i = 0; i < totalDots; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'dot-wrapper';
        
        const circle = document.createElement('div');
        circle.className = 'circle';
        
        wrapper.appendChild(circle);
        grid.appendChild(wrapper);

        wrapper.onpointerdown = (e) => {
          e.preventDefault();
          handleDotTap(i, circle, e);
        };
      }
      
      updateDots();
    }

    function updateDots() {
      const wrappers = document.querySelectorAll('.dot-wrapper');
      const targetIndex = orders.length > 0 ? orders[0] : -1;
      const currentTargetCount = Math.min(targetCount, numOfRows * numOfCols);
      
      wrappers.forEach((wrapper, i) => {
        const circle = wrapper.querySelector('.circle');
        if (i === targetIndex) {
          circle.classList.add('target');
          if (showNumber) {
            circle.textContent = currentTargetCount - orders.length + 1;
          } else {
            circle.textContent = '';
          }
        } else {
          circle.classList.remove('target');
          circle.textContent = '';
        }
      });
    }

    function handleDotTap(index, circleElement, event) {
      const currentTargetCount = Math.min(targetCount, numOfRows * numOfCols);

      if (orders.length === currentTargetCount && startTime === null) {
        startTime = new Date();
        startTimer();
      }

      if (orders.length > 0 && orders[0] === index) {
        if (showEffect) {
          const rect = circleElement.getBoundingClientRect();
          const playAreaRect = document.getElementById('play-area').getBoundingClientRect();
          const centerX = (rect.left + rect.width / 2) - playAreaRect.left;
          const centerY = (rect.top + rect.height / 2) - playAreaRect.top;
          triggerBurstEffect(centerX, centerY);
        }

        orders.shift();
        
        if (orders.length === 0) {
          stopTimer();
          updateTime();
          
          playCorrectSound();
          
          if (showNumber) {
            speechWord(currentTargetCount);
          }
          
          setTimeout(() => {
            showScreen('home-screen');
          }, 2000);
          
        } else {
          if (showNumber) {
            const numForSpeech = currentTargetCount - orders.length;
            speechWord(numForSpeech);
          } else {
            playClickSound();
          }
          updateDots();
        }
      }
    }

    // --- イベントリスナー設定 ---
    document.addEventListener('DOMContentLoaded', () => {
      loadSettings();

      document.getElementById('input-rows').addEventListener('input', updateTargetCountRange);
      document.getElementById('input-cols').addEventListener('input', updateTargetCountRange);
      
      document.getElementById('input-target-count').addEventListener('input', (e) => {
        document.getElementById('target-count-val').textContent = `${e.target.value}回`;
      });

      document.getElementById('btn-start').onpointerdown = (e) => {
        e.preventDefault();
        unlockAudio();
        saveSettings();
        initGame();
        showScreen('play-screen');
      };

      let tapCount = 0;
      let tapTimeout = null;
      document.getElementById('btn-setting').onpointerdown = (e) => {
        e.preventDefault();
        tapCount++;
        
        if (tapCount === 1) {
          tapTimeout = setTimeout(() => {
            tapCount = 0;
          }, 800);
        }
        
        if (tapCount === 3) {
          clearTimeout(tapTimeout);
          tapCount = 0;
          showScreen('setting-screen');
        }
      };

      document.getElementById('btn-setting-close').onpointerdown = (e) => {
        e.preventDefault();
        saveSettings();
        showScreen('home-screen');
      };

      document.getElementById('btn-home').onpointerdown = (e) => {
        e.preventDefault();
        showScreen('home-screen');
      };
    });
  </script>
</body>
</html>
