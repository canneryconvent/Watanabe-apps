<!DOCTYPE html>
<html lang="ja" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>特別支援学校小学部 指導要領アセスメントシステム</title>
  <style>
    /* ==========================================================================
       カラーテーマ定義（5種類）
       ========================================================================== */

    /* 1. ダークモード（デフォルト） */
    :root,
    [data-theme="dark"] {
      --bg-main: #090d16;
      --bg-sub: #131b2e;
      --bg-card: #1e293b;
      --bg-card-focus: #1e3a5f;
      --header-bg: #0b1120;
      --input-bg: #090d16;
      --table-header-bg: #0f172a;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --lv-double-ok: #2563eb; /* ◎ */
      --lv-ok: #059669;        /* ◯ */
      --lv-triangle: #d97706;  /* △ */
      --lv-ng: #dc2626;        /* ✖ */
      --font-scale: 13.5px;
    }

    /* 2. ライトモード（明瞭な白基調） */
    [data-theme="light"] {
      --bg-main: #f8fafc;
      --bg-sub: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-focus: #e0f2fe;
      --header-bg: #ffffff;
      --input-bg: #ffffff;
      --table-header-bg: #e2e8f0;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --lv-double-ok: #2563eb;
      --lv-ok: #059669;
      --lv-triangle: #d97706;
      --lv-ng: #dc2626;
      --font-scale: 13.5px;
    }

    /* 3. ウォーム・アイケア（疲れ目を防ぐセピア・和紙調） */
    [data-theme="warm"] {
      --bg-main: #f4ece1;
      --bg-sub: #eae0d0;
      --bg-card: #fdfaf5;
      --bg-card-focus: #fef3c7;
      --header-bg: #e5d7c3;
      --input-bg: #ffffff;
      --table-header-bg: #dfcfbc;
      --border-color: #d5c3b0;
      --text-main: #3d312a;
      --text-muted: #7c6f64;
      --accent: #b45309;
      --lv-double-ok: #1d4ed8;
      --lv-ok: #047857;
      --lv-triangle: #b45309;
      --lv-ng: #b91c1c;
      --font-scale: 13.5px;
    }

    /* 4. オーシャン・カーム（集中力を保つ深青調） */
    [data-theme="ocean"] {
      --bg-main: #071927;
      --bg-sub: #0b253a;
      --bg-card: #0f2d47;
      --bg-card-focus: #164e78;
      --header-bg: #05121c;
      --input-bg: #071927;
      --table-header-bg: #133857;
      --border-color: #1e4b75;
      --text-main: #e0f2fe;
      --text-muted: #7dd3fc;
      --accent: #38bdf8;
      --lv-double-ok: #0284c7;
      --lv-ok: #059669;
      --lv-triangle: #d97706;
      --lv-ng: #e11d48;
      --font-scale: 13.5px;
    }

    /* 5. ハイコントラスト（UD視認性・境界明瞭化） */
    [data-theme="contrast"] {
      --bg-main: #000000;
      --bg-sub: #141414;
      --bg-card: #181818;
      --bg-card-focus: #333333;
      --header-bg: #000000;
      --input-bg: #000000;
      --table-header-bg: #262626;
      --border-color: #ffffff;
      --text-main: #ffffff;
      --text-muted: #e5e5e5;
      --accent: #facc15;
      --lv-double-ok: #3b82f6;
      --lv-ok: #10b981;
      --lv-triangle: #f59e0b;
      --lv-ng: #ef4444;
      --font-scale: 13.5px;
    }

    /* ==========================================================================
       基本レイアウト & 全体設定
       ========================================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-size: var(--font-scale);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    header {
      background-color: var(--header-bg);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
      gap: 12px;
    }

    .header-title-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }

    .student-selector-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-main);
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .student-selector-bar select,
    .student-selector-bar input {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .student-selector-bar select:focus,
    .student-selector-bar input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .header-ctrls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-tool {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-tool:hover {
      filter: brightness(1.15);
      border-color: var(--accent);
    }

    .btn-tool.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg-main);
    }

    .btn-tool.btn-save {
      background: #1e3a8a;
      border-color: #3b82f6;
      color: #ffffff;
    }

    .btn-tool.btn-save:hover {
      background: #2563eb;
    }

    .mode-switch {
      display: flex;
      background: var(--bg-main);
      border-radius: 6px;
      padding: 2px;
      border: 1px solid var(--border-color);
    }

    .mode-btn {
      padding: 4px 12px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mode-btn.active {
      background: var(--accent);
      color: var(--bg-main);
    }

    .keyboard-guide {
      background: var(--bg-main);
      padding: 4px 16px;
      font-size: 0.72rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      align-items: center;
      flex-shrink: 0;
    }

    .kb-key {
      background: var(--bg-card);
      color: var(--text-main);
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: bold;
      border: 1px solid var(--border-color);
    }

    /* ==========================================================================
       入力モード（表・スプレッドシート形式）
       ========================================================================== */

    .main-layout-input {
      display: grid;
      grid-template-columns: 1fr 420px;
      flex: 1;
      overflow: hidden;
    }

    .checklist-section {
      display: flex;
      flex-direction: column;
      background: var(--bg-main);
      border-right: 1px solid var(--border-color);
      overflow: hidden;
    }

    .filter-toolbar {
      padding: 8px 16px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      flex-shrink: 0;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .filter-group span {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .items-scroll {
      flex: 1;
      overflow-y: auto;
      background: var(--bg-main);
    }

    /* 表形式テーブル */
    .eval-table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--font-scale);
      text-align: left;
    }

    .eval-table th {
      position: sticky;
      top: 0;
      background: var(--table-header-bg);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.78rem;
      padding: 8px 10px;
      border-bottom: 2px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      z-index: 5;
      white-space: nowrap;
    }

    .eval-table td {
      padding: 6px 8px;
      border-bottom: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      vertical-align: middle;
      background: var(--bg-card);
      transition: background-color 0.1s;
    }

    .eval-row {
      cursor: pointer;
    }

    .eval-row:hover td {
      background: var(--bg-card-focus) !important;
    }

    .eval-row.focused td {
      background: var(--bg-card-focus) !important;
      border-top: 1px solid var(--accent);
      border-bottom: 1px solid var(--accent);
    }

    .eval-row.lv-3 td:first-child { border-left: 5px solid var(--lv-double-ok); }
    .eval-row.lv-2 td:first-child { border-left: 5px solid var(--lv-ok); }
    .eval-row.lv-1 td:first-child { border-left: 5px solid var(--lv-triangle); }
    .eval-row.lv-0 td:first-child { border-left: 5px solid var(--lv-ng); }
    .eval-row.lv-none td:first-child { border-left: 5px solid transparent; }

    /* 表内ボタン配置 */
    .eval-btn-cell {
      width: 170px;
      white-space: nowrap;
    }

    .eval-btn-group-sm {
      display: inline-flex;
      gap: 3px;
    }

    .eval-btn-sm {
      width: 34px;
      height: 32px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--bg-main);
      color: var(--text-muted);
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
    }

    .eval-btn-sm span.key-sub {
      font-size: 0.55rem;
      font-weight: normal;
      opacity: 0.7;
      line-height: 1;
    }

    .eval-btn-sm:hover {
      background: var(--bg-card-focus);
      color: var(--text-main);
      transform: translateY(-1px);
    }

    .eval-btn-sm.b-3.active { background: var(--lv-double-ok); color: #fff; border-color: var(--lv-double-ok); }
    .eval-btn-sm.b-2.active { background: var(--lv-ok); color: #fff; border-color: var(--lv-ok); }
    .eval-btn-sm.b-1.active { background: var(--lv-triangle); color: #fff; border-color: var(--lv-triangle); }
    .eval-btn-sm.b-0.active { background: var(--lv-ng); color: #fff; border-color: var(--lv-ng); }

    /* タグ関連 */
    .tag {
      font-size: 0.68rem;
      padding: 2px 5px;
      border-radius: 3px;
      font-weight: 600;
      display: inline-block;
      white-space: nowrap;
    }

    .tag-sub-生活 { background: #065f46; color: #a7f3d0; }
    .tag-sub-国語 { background: #7f1d1d; color: #fecaca; }
    .tag-sub-算数 { background: #1e3a8a; color: #bfdbfe; }
    .tag-sub-音楽 { background: #581c87; color: #e9d5ff; }
    .tag-sub-図画工作 { background: #831843; color: #fbcfe8; }
    .tag-sub-体育 { background: #78350f; color: #fde68a; }

    /* 段階別タグ */
    .tag-stage-1 { background: rgba(16, 185, 129, 0.2) !important; color: #10b981 !important; border: 1px solid rgba(16, 185, 129, 0.4); }
    .tag-stage-2 { background: rgba(245, 158, 11, 0.2) !important; color: #f59e0b !important; border: 1px solid rgba(245, 158, 11, 0.4); }
    .tag-stage-3 { background: rgba(139, 92, 246, 0.2) !important; color: #8b5cf6 !important; border: 1px solid rgba(139, 92, 246, 0.4); }

    /* 観点別タグ（3観点色分け） */
    .tag-aspect-k { background: rgba(6, 182, 212, 0.18); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.4); } /* 知識及び技能 */
    .tag-aspect-t { background: rgba(245, 158, 11, 0.18); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); } /* 思考力，判断力，表現力等 */
    .tag-aspect-a { background: rgba(236, 72, 153, 0.18); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.4); } /* 学びに向かう力，人間性等 */

    .table-memo-input {
      width: 100%;
      min-width: 130px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-main);
      font-size: 0.78rem;
      padding: 4px 6px;
      resize: vertical;
      font-family: inherit;
    }

    .table-memo-input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--bg-card-focus);
    }

    /* ==========================================================================
       集計サイドパネル
       ========================================================================== */

    .visual-section {
      display: flex;
      flex-direction: column;
      background: var(--bg-sub);
      overflow-y: auto;
      padding: 12px;
      gap: 10px;
    }

    .view-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
    }

    .view-card h2 {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .domain-bar-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .domain-row {
      font-size: 0.75rem;
    }

    .domain-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .domain-label .name {
      font-weight: 600;
      color: var(--text-main);
    }

    .domain-label .score {
      color: var(--accent);
      font-weight: 700;
    }

    .progress-track {
      height: 10px;
      background: var(--bg-main);
      border-radius: 5px;
      overflow: hidden;
      display: flex;
      border: 1px solid var(--border-color);
    }

    .progress-fill {
      height: 100%;
      transition: width 0.3s ease;
    }

    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.72rem;
      text-align: center;
    }

    .matrix-table th,
    .matrix-table td {
      padding: 5px 3px;
      border: 1px solid var(--border-color);
    }

    .matrix-table th {
      background: var(--bg-main);
      color: var(--text-muted);
      font-weight: 600;
    }

    .matrix-cell {
      font-weight: 700;
      border-radius: 3px;
    }

    .summary-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      text-align: center;
    }

    .stat-box {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 2px;
    }

    .stat-box .title {
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .stat-box .val {
      font-size: 1.15rem;
      font-weight: 700;
    }

    /* ==========================================================================
       並列確認モード レイアウト
       ========================================================================== */

    .main-layout-view {
      display: none;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
      background: var(--bg-main);
      padding: 10px 16px;
      gap: 10px;
    }

    .view-top-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--header-bg);
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 8px;
    }

    .view-mode-tabs {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: var(--bg-main);
      border-color: var(--accent);
    }

    .parallel-table-container {
      flex: 1;
      overflow: auto;
      background: var(--bg-sub);
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    .parallel-table {
      width: 100%;
      border-collapse: collapse;
      font-size: calc(var(--font-scale) * 0.92);
      min-width: 1000px;
    }

    .parallel-table th {
      position: sticky;
      top: 0;
      background: var(--table-header-bg);
      color: var(--accent);
      font-weight: 700;
      padding: 8px 10px;
      border-bottom: 2px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      z-index: 10;
      text-align: left;
    }

    .parallel-table td {
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      vertical-align: top;
      background: var(--bg-card);
    }

    .strand-header-cell {
      background: var(--bg-sub) !important;
      font-weight: 700;
      color: var(--text-main);
      width: 240px;
      font-size: calc(var(--font-scale) * 0.85);
    }

    .p-cell-box {
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      height: 100%;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
    }

    .p-cell-box.empty {
      color: var(--text-muted);
      font-style: italic;
      text-align: center;
      padding: 20px 0;
      background: transparent;
      border: none;
    }

    .p-cell-box.lv-3 { background: rgba(37, 99, 235, 0.12); border-left: 4px solid var(--lv-double-ok); }
    .p-cell-box.lv-2 { background: rgba(5, 150, 105, 0.12); border-left: 4px solid var(--lv-ok); }
    .p-cell-box.lv-1 { background: rgba(217, 119, 6, 0.12); border-left: 4px solid var(--lv-triangle); }
    .p-cell-box.lv-0 { background: rgba(220, 38, 38, 0.12); border-left: 4px solid var(--lv-ng); }
    .p-cell-box.lv-none { background: rgba(148, 163, 184, 0.08); border-left: 4px solid var(--border-color); }

    .p-cell-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .p-eval-tag {
      font-size: 0.95rem;
      font-weight: 800;
      padding: 1px 8px;
      border-radius: 4px;
    }

    .p-eval-tag.tag-3 { background: var(--lv-double-ok); color: #fff; }
    .p-eval-tag.tag-2 { background: var(--lv-ok); color: #fff; }
    .p-eval-tag.tag-1 { background: var(--lv-triangle); color: #fff; }
    .p-eval-tag.tag-0 { background: var(--lv-ng); color: #fff; }
    .p-eval-tag.tag-none {
      background: var(--bg-sub);
      color: var(--text-muted);
      font-size: 0.75rem;
      border: 1px solid var(--border-color);
    }

    .p-cell-text {
      line-height: 1.45;
      color: var(--text-main);
    }

    .p-cell-memo {
      margin-top: auto;
      font-size: calc(var(--font-scale) * 0.8);
      background: var(--bg-sub);
      padding: 4px 6px;
      border-radius: 4px;
      color: var(--text-muted);
      border-left: 2px solid var(--accent);
    }

    /* ==========================================================================
       モーダルダイアログ
       ========================================================================== */

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      width: 360px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .modal-box h3 {
      font-size: 1rem;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .modal-box input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .modal-box input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .modal-btns {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    #parallelTableHead th:nth-child(2) { color: #10b981; }
    #parallelTableHead th:nth-child(3) { color: #f59e0b; }
    #parallelTableHead th:nth-child(4) { color: #8b5cf6; }
  </style>
</head>

<body>

  <header>
    <div class="header-title-area">
      <h1>小学部 指導要領アセスメント</h1>
      <div class="mode-switch">
        <button class="mode-btn active" id="btnModeInput" onclick="setMode('input')">✏️ 入力モード</button>
        <button class="mode-btn" id="btnModeView" onclick="setMode('view')">👁 並列確認モード</button>
      </div>
    </div>

    <div class="student-selector-bar">
      <select id="studentSelect" onchange="changeStudent(this.value)"></select>
      <button class="btn-tool" style="padding:3px 6px;" onclick="addNewStudent()">＋ 追加</button>
      <button class="btn-tool" style="padding:3px 6px; color:#ef4444;" onclick="deleteCurrentStudent()">削除</button>
      <input type="date" id="metaDate" style="width: 120px;" onchange="saveCurrentMeta()">
      <input type="text" id="metaAssessor" placeholder="記入者" style="width: 80px;" onchange="saveCurrentMeta()">
    </div>

    <div class="header-ctrls">
      <div class="filter-group" style="margin-right: 6px;">
        <button class="btn-tool" onclick="setFontScale('12.5px')">小</button>
        <button class="btn-tool active" id="f-default" onclick="setFontScale('13.5px')">中</button>
        <button class="btn-tool" onclick="setFontScale('15px')">大</button>
      </div>
      <button class="btn-tool btn-save" onclick="promptSaveEncrypted()">🔒 暗号化保存</button>
      <button class="btn-tool" onclick="document.getElementById('fileInput').click()">📂 復号読込</button>
      <input type="file" id="fileInput" style="display:none;" accept=".enc,.json" onchange="handleFileLoad(event)">
      <button class="btn-tool" onclick="resetCurrentStudent()">リセット</button>

      <!-- テーマ切り替えセレクター -->
      <div class="filter-group" style="margin-left: 4px;">
        <select id="themeSelect" class="btn-tool" onchange="applyTheme(this.value)" style="cursor: pointer; padding: 4px 8px;">
          <option value="dark">🌙 ダーク</option>
          <option value="light">☀️ ライト</option>
          <option value="warm">📜 ウォーム（目に優しい）</option>
          <option value="ocean">🌊 オーシャン</option>
          <option value="contrast">👁️ ハイコントラスト</option>
        </select>
      </div>
    </div>
  </header>

  <div class="keyboard-guide" id="kbGuideBar">
    <span>⌨ <strong>キー操作:</strong></span>
    <span><span class="kb-key">1</span> ✖</span>
    <span><span class="kb-key">2</span> △</span>
    <span><span class="kb-key">3</span> ◯</span>
    <span><span class="kb-key">4</span> ◎</span>
    <span><span class="kb-key">↓</span><span class="kb-key">↑</span> 移動</span>
    <span><span class="kb-key">Del</span> 解除</span>
    <span style="color:var(--accent); margin-left:auto;">※表の各行を選択・数字キーで入力して次の行へ自動移動します</span>
  </div>

  <div class="main-layout-input" id="inputLayout">
    <div class="checklist-section">
      <div class="filter-toolbar">
        <div class="filter-group">
          <span>教科:</span>
          <button class="btn-tool active" data-filter="sub" data-val="all">全て</button>
          <button class="btn-tool" data-filter="sub" data-val="生活">生活</button>
          <button class="btn-tool" data-filter="sub" data-val="国語">国語</button>
          <button class="btn-tool" data-filter="sub" data-val="算数">算数</button>
          <button class="btn-tool" data-filter="sub" data-val="音楽">音楽</button>
          <button class="btn-tool" data-filter="sub" data-val="図画工作">図工</button>
          <button class="btn-tool" data-filter="sub" data-val="体育">体育</button>
        </div>
        <div class="filter-group">
          <span>段階:</span>
          <button class="btn-tool active" data-filter="stage" data-val="all">全段階</button>
          <button class="btn-tool" data-filter="stage" data-val="1">1段階</button>
          <button class="btn-tool" data-filter="stage" data-val="2">2段階</button>
          <button class="btn-tool" data-filter="stage" data-val="3">3段階</button>
        </div>
        <div class="filter-group">
          <span>絞込:</span>
          <select id="evalFilter" class="btn-tool" onchange="renderItemList()">
            <option value="all">全項目表示</option>
            <option value="unrated">未評価のみ</option>
            <option value="rated">評価済のみ</option>
            <option value="ng_only">✖ のみ</option>
            <option value="has_memo">メモありのみ</option>
          </select>
        </div>
        <div id="counterBadge" style="font-size:0.75rem; color:var(--accent); margin-left:auto;"></div>
      </div>

      <!-- 表スタイル描画エリア -->
      <div class="items-scroll" id="itemsList"></div>
    </div>

    <div class="visual-section">
      <div class="view-card">
        <h2>評価ステータス集計</h2>
        <div class="summary-stats-grid">
          <div class="stat-box" style="border-top: 3px solid var(--lv-ng);">
            <div class="title" style="color:var(--lv-ng);">✖</div>
            <div class="val" id="cnt-0" style="color:var(--lv-ng);">0</div>
          </div>
          <div class="stat-box" style="border-top: 3px solid var(--lv-triangle);">
            <div class="title" style="color:var(--lv-triangle);">△</div>
            <div class="val" id="cnt-1" style="color:var(--lv-triangle);">0</div>
          </div>
          <div class="stat-box" style="border-top: 3px solid var(--lv-ok);">
            <div class="title" style="color:var(--lv-ok);">◯</div>
            <div class="val" id="cnt-2" style="color:var(--lv-ok);">0</div>
          </div>
          <div class="stat-box" style="border-top: 3px solid var(--lv-double-ok);">
            <div class="title" style="color:var(--lv-double-ok);">◎</div>
            <div class="val" id="cnt-3" style="color:var(--lv-double-ok);">0</div>
          </div>
        </div>
      </div>

      <div class="view-card">
        <h2>段階別・教科別 習得率マトリクス</h2>
        <table class="matrix-table">
          <thead>
            <tr>
              <th>教科</th>
              <th>第1段階</th>
              <th>第2段階</th>
              <th>第3段階</th>
            </tr>
          </thead>
          <tbody id="matrixTableBody"></tbody>
        </table>
      </div>

      <div class="view-card">
        <h2>領域別 習得度プロファイル</h2>
        <div class="domain-bar-group" id="domainBars"></div>
      </div>

      <div class="view-card">
        <h2>資質・能力の観点別バランス</h2>
        <div class="domain-bar-group" id="aspectBars"></div>
      </div>
    </div>
  </div>

  <div class="main-layout-view" id="viewLayout">
    <div class="view-top-toolbar">
      <div class="view-mode-tabs">
        <button class="tab-btn active" id="tab_L_123" onclick="switchParallelView('L_123')">🌱 生活(1〜3)</button>
        <button class="tab-btn" id="tab_K_123" onclick="switchParallelView('K_123')">📖 国語(1〜3)</button>
        <button class="tab-btn" id="tab_S_123" onclick="switchParallelView('S_123')">📐 算数(1〜3)</button>
        <button class="tab-btn" id="tab_M_123" onclick="switchParallelView('M_123')">🎵 音楽(1〜3)</button>
        <button class="tab-btn" id="tab_A_123" onclick="switchParallelView('A_123')">🎨 図工(1〜3)</button>
        <button class="tab-btn" id="tab_P_123" onclick="switchParallelView('P_123')">🏃 体育(1〜3)</button>
        <span style="border-left:1px solid var(--border-color); margin: 0 2px;"></span>
        <button class="tab-btn" id="tab_STAGE_1" onclick="switchParallelView('STAGE_1')">第1段階(全教科並列)</button>
        <button class="tab-btn" id="tab_STAGE_2" onclick="switchParallelView('STAGE_2')">第2段階(全教科並列)</button>
        <button class="tab-btn" id="tab_STAGE_3" onclick="switchParallelView('STAGE_3')">第3段階(全教科並列)</button>
      </div>
    </div>

    <div class="parallel-table-container">
      <table class="parallel-table" id="parallelTable">
        <thead id="parallelTableHead"></thead>
        <tbody id="parallelTableBody"></tbody>
      </table>
    </div>
  </div>

  <div id="saveModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h3>🔒 暗号化保存</h3>
      <p style="font-size:0.75rem; color:var(--text-muted); margin-bottom:10px;">パスワードを設定して全児童生徒データを暗号化出力します（2回入力）。</p>
      <input type="password" id="pass1" placeholder="パスワードを入力">
      <input type="password" id="pass2" placeholder="パスワードの再確認">
      <div class="modal-btns">
        <button class="btn-tool" onclick="closeSaveModal()">キャンセル</button>
        <button class="btn-tool btn-save" onclick="executeEncryptedSave()">暗号化して保存</button>
      </div>
    </div>
  </div>

  <div id="loadModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h3>📂 暗号化データの復号</h3>
      <p style="font-size:0.75rem; color:var(--text-muted); margin-bottom:10px;">ファイル保存時のパスワードを入力してください。</p>
      <input type="password" id="loadPass" placeholder="パスワードを入力">
      <div class="modal-btns">
        <button class="btn-tool" onclick="closeLoadModal()">キャンセル</button>
        <button class="btn-tool btn-save" onclick="executeDecryptLoad()">復号して読み込む</button>
      </div>
    </div>
  </div>

  <!-- 分割データファイルの読み込み -->
  <script src="data_seikatsu.js"></script>
  <script src="data_kokugo.js"></script>
  <script src="data_sansu.js"></script>
  <script src="data_ongaku.js"></script>
  <script src="data_zuko.js"></script>
  <script src="data_taiiku.js"></script>
  <script src="app.js"></script>
</body>

</html>
