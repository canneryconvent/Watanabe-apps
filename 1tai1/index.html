<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>一つずつ配ろう</title>
    <!-- ホーム画面追加用アイコン設定 -->
    <link rel="apple-touch-icon" href="img.png">
    <link rel="icon" href="img.png">
    <style>
        :root {
            --primary: #007AFF;
            --primary-active: #0056b3;
            --bg-color: #ffffff;
            --text-color: #000000;
            --ios-gray-bg: #f2f2f7;
            --ios-card-bg: #ffffff;
            --ios-border: #e5e5ea;
        }
        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            touch-action: none;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: opacity 0.25s ease;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        /* --- スタート画面 --- */
        #start-screen {
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            gap: 1.5rem;
        }
        .btn-ios-primary {
            font-size: 2.2rem;
            padding: 1rem 4rem;
            border: none;
            border-radius: 16px;
            background-color: #ff9800;
            color: white;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 0.05em;
            transition: opacity 0.15s;
        }
        .btn-ios-primary:active {
            opacity: 0.7;
        }

        .btn-ios-secondary {
            font-size: 1.2rem;
            padding: 0.8rem 2.5rem;
            border: none;
            border-radius: 12px;
            background-color: var(--ios-gray-bg);
            color: #3a3a3c;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: opacity 0.15s;
        }
        .btn-ios-secondary:active {
            opacity: 0.7;
        }
        .sub-text {
            font-size: 0.75rem;
            color: #8e8e93;
            font-weight: normal;
        }

        /* 右上の問題数表示 */
        #score-board {
            position: absolute;
            top: 20px;
            right: 25px;
            z-index: 10;
        }
        .score-badge {
            background-color: transparent;
            color: #8e8e93;
            font-size: 1.3rem;
            padding: 0;
            font-weight: 600;
            box-shadow: none;
            border: none;
        }

        /* 1問クリア時の視覚的フィードバック */
        #clear-mark {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) scale(0.3);
            font-size: clamp(70px, 14vw, 120px);
            color: #ff3b30;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            line-height: 1;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.2));
        }
        #clear-mark.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        /* 画面全体のステージ領域 */
        #stage-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 指定位置（20vh, 40vh, 60vh, 80vh）に配置する行 */
        .row {
            position: absolute;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 3vw;
            transform: translateY(-50%);
        }

        /* 高さ指定用クラス */
        .pos-1-5 { top: 20vh; }
        .pos-2-5 { top: 40vh; }
        .pos-3-5 { top: 60vh; }
        .pos-4-5 { top: 80vh; }

        /* オブジェクトサイズ */
        .plate {
            width: clamp(90px, 18vw, 210px);
            aspect-ratio: 2 / 1;
            position: relative;
            transition: filter 0.3s ease, opacity 0.3s ease;
        }
        .plate-svg {
            width: 100%;
            height: 100%;
        }

        /* 目印の皿（光るアニメーション） */
        .plate.target-plate {
            opacity: 1 !important;
            filter: drop-shadow(0 0 14px #ffcc00) drop-shadow(0 0 4px #ff9800) !important;
            animation: plate-pulse 1.2s infinite alternate ease-in-out;
        }
        @keyframes plate-pulse {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 8px #ffcc00);
            }
            100% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 20px #ffcc00) drop-shadow(0 0 8px #ff9800);
            }
        }

        /* 暗く表示される皿 */
        .plate.dimmed-plate {
            opacity: 0.32;
            filter: grayscale(0.5) brightness(0.8);
        }
        
        /* かげモード用のシルエット（皿の中心から2/5上の位置へ調整） */
        .plate-shadow {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(65px, 14vw, 140px);
            height: clamp(65px, 14vw, 140px);
            pointer-events: none;
            filter: brightness(0) opacity(0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(45px, 10vw, 100px);
            line-height: 1;
        }

        .item-slot {
            width: clamp(65px, 14vw, 140px);
            aspect-ratio: 1 / 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item {
            width: clamp(65px, 14vw, 140px);
            height: clamp(65px, 14vw, 140px);
            position: absolute;
            top: 0;
            left: 0;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(45px, 10vw, 100px);
            line-height: 1;
            user-select: none;
        }
        .item:active {
            cursor: grabbing;
        }
        .item.dragging {
            transform: scale(1.18);
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.25));
            z-index: 1000;
        }

        /* モーダル表示 */
        #settings-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 2vw;
        }
        .ios-form-wrapper {
            background-color: var(--ios-gray-bg);
            width: 96vw;
            height: 92vh;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
        }
        .ios-form-header {
            padding: 1.2rem;
            background-color: var(--ios-card-bg);
            border-bottom: 1px solid var(--ios-border);
            text-align: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: #000;
        }
        .ios-form-body-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        @media (max-width: 800px) {
            .ios-form-body-container {
                flex-direction: column;
            }
        }

        .ios-form-left {
            flex: 1.2;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            border-right: 1px solid var(--ios-border);
        }

        .ios-form-right {
            flex: 1;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            padding: 1.2rem;
            overflow: hidden;
            position: relative;
        }
        .sample-view-header {
            font-size: 0.85rem;
            font-weight: 600;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sample-badge {
            background-color: #e5f1ff;
            color: var(--primary);
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-weight: 600;
        }
        .sample-stage {
            flex: 1;
            border: 2px dashed var(--ios-border);
            border-radius: 16px;
            background-color: #fafafa;
            position: relative;
            overflow: hidden;
        }

        /* サンプルビュー内での位置指定 */
        .sample-row {
            position: absolute;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 2%;
            transform: translateY(-50%);
        }
        .sample-row.sample-pos-1-5 { top: 20%; }
        .sample-row.sample-pos-2-5 { top: 40%; }
        .sample-row.sample-pos-3-5 { top: 60%; }
        .sample-row.sample-pos-4-5 { top: 80%; }

        .sample-plate {
            width: clamp(45px, 20%, 90px);
            aspect-ratio: 2 / 1;
            position: relative;
            transition: filter 0.3s, opacity 0.3s;
        }
        .sample-plate.sample-target {
            opacity: 1 !important;
            filter: drop-shadow(0 0 8px #ffcc00) !important;
        }
        .sample-plate.sample-dimmed {
            opacity: 0.3;
            filter: grayscale(0.5);
        }

        .sample-plate-shadow {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(30px, 15%, 55px);
            height: clamp(30px, 15%, 55px);
            pointer-events: none;
            filter: brightness(0) opacity(0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(20px, 4vw, 38px);
            line-height: 1;
        }
        .sample-item-slot {
            width: clamp(30px, 15%, 55px);
            aspect-ratio: 1 / 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(20px, 4vw, 38px);
            line-height: 1;
        }

        .ios-section {
            background-color: var(--ios-card-bg);
            border-radius: 14px;
            border: 1px solid var(--ios-border);
            overflow: hidden;
        }
        .ios-section-title-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.2rem 0.5rem 0.3rem 0.5rem;
        }
        .ios-section-title {
            font-size: 0.85rem;
            color: #6c6c70;
            text-transform: uppercase;
            font-weight: 600;
        }
        .ios-btn-group-mini {
            display: flex;
            gap: 0.4rem;
        }
        .ios-btn-mini {
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            background-color: #e5f1ff;
            color: var(--primary);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .ios-btn-mini:active {
            opacity: 0.6;
        }

        .ios-slider-row {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            padding: 0.9rem 1.2rem;
            border-bottom: 1px solid var(--ios-border);
        }
        .ios-slider-row:last-child {
            border-bottom: none;
        }
        .ios-slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.05rem;
            font-weight: 500;
            color: #000;
        }
        input[type="range"] {
            width: 100%;
            height: 32px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .ios-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 1.2rem;
            border-bottom: 1px solid var(--ios-border);
            font-size: 1.05rem;
        }
        .ios-row:last-child {
            border-bottom: none;
        }
        .ios-row label {
            font-weight: 500;
            color: #000;
        }

        .ios-checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            padding: 0.8rem 1rem;
        }
        .ios-chip {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background-color: var(--ios-gray-bg);
            padding: 0.6rem 1.1rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            border: 2px solid transparent;
            transition: all 0.15s;
        }
        .ios-chip input {
            display: none;
        }
        .ios-chip:has(input:checked) {
            background-color: #e5f1ff;
            border-color: var(--primary);
            color: var(--primary);
            font-weight: 600;
        }

        .ios-segmented {
            display: flex;
            background-color: var(--ios-gray-bg);
            padding: 3px;
            border-radius: 10px;
        }
        .ios-segmented-btn {
            padding: 0.5rem 1rem;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            color: #000;
            transition: background 0.15s;
        }
        .ios-segmented-btn:has(input:checked) {
            background-color: var(--ios-card-bg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.12);
            font-weight: 600;
        }
        .ios-segmented-btn input {
            display: none;
        }

        .ios-form-footer {
            padding: 1rem 1.5rem 1.2rem 1.5rem;
            background-color: var(--ios-gray-bg);
            border-top: 1px solid var(--ios-border);
        }
        .ios-btn-done {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
        }
        .ios-btn-done:active {
            background-color: var(--primary-active);
        }
    </style>
</head>
<body>
    <div id="settings-modal" class="hidden">
        <div class="ios-form-wrapper">
            <div class="ios-form-header">設定</div>
            
            <div class="ios-form-body-container">
                <!-- 左側：設定フォーム -->
                <div class="ios-form-left">
                    
                    <!-- 配るもの（初期状態ですべての果物をON、丸のみOFF） -->
                    <div>
                        <div class="ios-section-title-wrap">
                            <span class="ios-section-title">配るもの</span>
                            <div class="ios-btn-group-mini">
                                <button type="button" id="btn-select-all" class="ios-btn-mini">全選択</button>
                                <button type="button" id="btn-deselect-all" class="ios-btn-mini">全解除</button>
                            </div>
                        </div>
                        <div class="ios-section">
                            <div class="ios-checkbox-group">
                                <label class="ios-chip">
                                    <input type="checkbox" name="setting-items" value="apple" checked>
                                    <span>🍎 りんご</span>
                                </label>
                                <label class="ios-chip">
                                    <input type="checkbox" name="setting-items" value="orange" checked>
                                    <span>🍊 みかん</span>
                                </label>
                                <label class="ios-chip">
                                    <input type="checkbox" name="setting-items" value="grape" checked>
                                    <span>🍇 ぶどう</span>
                                </label>
                                <label class="ios-chip">
                                    <input type="checkbox" name="setting-items" value="strawberry" checked>
                                    <span>🍓 いちご</span>
                                </label>
                                <label class="ios-chip">
                                    <input type="checkbox" name="setting-items" value="banana" checked>
                                    <span>🍌 ばなな</span>
                                </label>
                                <label class="ios-chip">
                                    <input type="checkbox" name="setting-items" value="watermelon" checked>
                                    <span>🍉 すいか</span>
                                </label>
                                <label class="ios-chip">
                                    <input type="checkbox" name="setting-items" value="peach" checked>
                                    <span>🍑 もも</span>
                                </label>
                                <label class="ios-chip">
                                    <input type="checkbox" name="setting-items" value="cherry" checked>
                                    <span>🍒 さくらんぼ</span>
                                </label>
                                <label class="ios-chip">
                                    <input type="checkbox" name="setting-items" value="red-circle">
                                    <span>🔴 赤い丸</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- 問題設定 -->
                    <div>
                        <div class="ios-section-title">問題設定</div>
                        <div class="ios-section">
                            <div class="ios-slider-row">
                                <div class="ios-slider-header">
                                    <span>皿の数</span>
                                    <span id="plate-count-disp" class="ios-val-disp">3</span>
                                </div>
                                <input type="range" id="setting-count" min="1" max="10" value="3">
                            </div>
                            <div class="ios-slider-row">
                                <div class="ios-slider-header">
                                    <span>問題数</span>
                                    <span id="round-total-disp" class="ios-val-disp">5</span>
                                </div>
                                <input type="range" id="setting-total-rounds" min="1" max="20" value="5">
                            </div>
                            <div class="ios-row">
                                <label>配る順番</label>
                                <div class="ios-segmented">
                                    <label class="ios-segmented-btn">
                                        <input type="radio" name="setting-order-mode" value="any"> どこからでも
                                    </label>
                                    <label class="ios-segmented-btn">
                                        <input type="radio" name="setting-order-mode" value="sequential"> 左上から順に
                                    </label>
                                </div>
                            </div>
                            <div class="ios-row">
                                <label>果物の初期位置</label>
                                <div class="ios-segmented">
                                    <label class="ios-segmented-btn">
                                        <input type="radio" name="setting-pos-mode" value="ordered"> 順に並べる
                                    </label>
                                    <label class="ios-segmented-btn">
                                        <input type="radio" name="setting-pos-mode" value="random"> ランダム
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 表示と効果音 -->
                    <div>
                        <div class="ios-section-title">表示と効果音</div>
                        <div class="ios-section">
                            <div class="ios-row">
                                <label>皿の表示</label>
                                <div class="ios-segmented">
                                    <label class="ios-segmented-btn">
                                        <input type="radio" name="setting-style" value="normal"> ふつう
                                    </label>
                                    <label class="ios-segmented-btn">
                                        <input type="radio" name="setting-style" value="shadow"> かげ
                                    </label>
                                </div>
                            </div>
                            <div class="ios-row">
                                <label>効果音</label>
                                <div class="ios-segmented">
                                    <label class="ios-segmented-btn">
                                        <input type="radio" name="setting-sound" value="se"> あり
                                    </label>
                                    <label class="ios-segmented-btn">
                                        <input type="radio" name="setting-sound" value="none"> なし
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- 右側：サンプルビュー -->
                <div class="ios-form-right">
                    <div class="sample-view-header">
                        <span>リアルタイムプレビュー</span>
                        <span class="sample-badge">サンプル</span>
                    </div>
                    <div class="sample-stage">
                        <div id="sample-stage-area"></div>
                    </div>
                </div>
            </div>

            <div class="ios-form-footer">
                <button id="close-settings-btn" class="ios-btn-done">完了</button>
            </div>
        </div>
    </div>

    <!-- スタート画面 -->
    <div id="start-screen" class="screen">
        <button id="start-btn" class="btn-ios-primary">スタート</button>
        <button id="setting-trigger-btn" class="btn-ios-secondary">
            設定 <span class="sub-text">※トリプルタップ</span>
        </button>
    </div>

    <!-- プレイ画面 -->
    <div id="play-screen" class="screen hidden">
        <div id="score-board">
            <div id="round-count" class="score-badge">1 / 5</div>
        </div>
        <!-- クリア時の丸フィードバック -->
        <div id="clear-mark">⭕️</div>
        <div id="stage-area"></div>
    </div>

    <script>
        const defaultSettings = {
            plateCount: 3,
            totalRounds: 5,
            plateStyle: 'normal',
            soundType: 'se',
            selectedItems: ['apple', 'orange', 'grape', 'strawberry', 'banana', 'watermelon', 'peach', 'cherry'],
            itemPosMode: 'ordered',
            orderMode: 'any'
        };

        let settings = JSON.parse(localStorage.getItem('1to1Settings')) || defaultSettings;
        if (!settings.selectedItems || !Array.isArray(settings.selectedItems) || settings.selectedItems.length === 0) {
            settings.selectedItems = ['apple', 'orange', 'grape', 'strawberry', 'banana', 'watermelon', 'peach', 'cherry'];
        }
        if (!settings.itemPosMode) {
            settings.itemPosMode = 'ordered';
        }
        if (!settings.orderMode) {
            settings.orderMode = 'any';
        }

        let round = 1;
        let activeItem = null;
        let offsetX = 0;
        let offsetY = 0;
        let currentItemType = 'apple';
        let isClearing = false;

        const AudioController = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            play(type) {
                if (settings.soundType === 'none') return;

                this.init();
                const now = this.ctx.currentTime;

                if (type === 'snap') {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.5, now + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'clear') {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);     
                    osc.frequency.setValueAtTime(659.25, now + 0.1); 
                    osc.frequency.setValueAtTime(783.99, now + 0.2); 
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                } else if (type === 'all_clear') {
                    const notes = [
                        { freq: 523.25, time: 0, dur: 0.15 },    // C5
                        { freq: 659.25, time: 0.15, dur: 0.15 }, // E5
                        { freq: 783.99, time: 0.30, dur: 0.15 }, // G5
                        { freq: 1046.50, time: 0.45, dur: 0.8 }  // C6
                    ];

                    notes.forEach(note => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(note.freq, now + note.time);
                        gain.gain.setValueAtTime(0, now + note.time);
                        gain.gain.linearRampToValueAtTime(0.4, now + note.time + 0.03);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + note.time + note.dur);
                        osc.start(now + note.time);
                        osc.stop(now + note.time + note.dur);
                    });

                    [523.25, 659.25, 783.99].forEach(freq => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + 0.45);
                        gain.gain.setValueAtTime(0, now + 0.45);
                        gain.gain.linearRampToValueAtTime(0.25, now + 0.48);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.25);
                        osc.start(now + 0.45);
                        osc.stop(now + 1.25);
                    });
                }
            }
        };

        function getItemEmoji(type) {
            switch (type) {
                case 'apple': return '🍎';
                case 'orange': return '🍊';
                case 'grape': return '🍇';
                case 'strawberry': return '🍓';
                case 'banana': return '🍌';
                case 'watermelon': return '🍉';
                case 'peach': return '🍑';
                case 'cherry': return '🍒';
                case 'red-circle': return '🔴';
                default: return '🍎';
            }
        }

        /* 白くリアルで立体的な皿SVG */
        function getPlateSVG() {
            return `<svg viewBox="0 0 200 100" width="100%" height="100%" class="plate-svg">
                <defs>
                    <radialGradient id="plateBase" cx="50%" cy="35%" r="60%">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="70%" stop-color="#f4f4f6"/>
                        <stop offset="100%" stop-color="#dcdce0"/>
                    </radialGradient>
                    <radialGradient id="plateInner" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#e8e8ed"/>
                        <stop offset="85%" stop-color="#f8f8fa"/>
                        <stop offset="100%" stop-color="#ffffff"/>
                    </radialGradient>
                    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
                    </filter>
                </defs>
                <ellipse cx="100" cy="50" rx="92" ry="42" fill="url(#plateBase)" stroke="#000000" stroke-width="4.5" filter="url(#shadow)"/>
                <ellipse cx="100" cy="50" rx="64" ry="26" fill="url(#plateInner)" stroke="#d0d0d5" stroke-width="1.5"/>
            </svg>`;
        }

        function startGame() {
            AudioController.init();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('play-screen').classList.remove('hidden');
            round = 1;
            updateScoreDisplay();
            initRound();
        }

        function updateScoreDisplay() {
            document.getElementById('round-count').innerText = `${round} / ${settings.totalRounds}`;
        }

        function returnToHome() {
            isClearing = false;
            document.getElementById('clear-mark').classList.remove('show');
            document.querySelectorAll('.item').forEach(el => el.remove());
            const stageArea = document.getElementById('stage-area');
            if (stageArea) stageArea.innerHTML = '';

            document.getElementById('play-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        /* 皿のハイライト状態更新 */
        function updatePlateHighlights() {
            const plates = document.querySelectorAll('.plate');
            if (plates.length === 0) return;

            if (settings.orderMode !== 'sequential') {
                plates.forEach(p => {
                    p.classList.remove('target-plate', 'dimmed-plate');
                });
                return;
            }

            let nextTargetIdx = -1;
            for (let i = 0; i < plates.length; i++) {
                const plate = document.querySelector(`.plate[data-index="${i}"]`);
                if (plate && plate.dataset.hasItem !== "true") {
                    nextTargetIdx = i;
                    break;
                }
            }

            plates.forEach(p => {
                const idx = parseInt(p.dataset.index);
                p.classList.remove('target-plate', 'dimmed-plate');

                if (p.dataset.hasItem === "true") {
                    // 配置済み
                } else if (idx === nextTargetIdx) {
                    p.classList.add('target-plate');
                } else {
                    p.classList.add('dimmed-plate');
                }
            });
        }

        function initRound() {
            isClearing = false;
            document.getElementById('clear-mark').classList.remove('show');
            document.querySelectorAll('.item').forEach(el => el.remove());

            const stageArea = document.getElementById('stage-area');
            stageArea.innerHTML = '';

            const activePool = (settings.selectedItems && settings.selectedItems.length > 0) 
                ? settings.selectedItems 
                : ['apple'];
            currentItemType = activePool[Math.floor(Math.random() * activePool.length)];

            const count = settings.plateCount;
            let topCount, bottomCount;
            if (count <= 5) {
                topCount = count;
                bottomCount = 0;
            } else {
                topCount = Math.ceil(count / 2);
                bottomCount = Math.floor(count / 2);
            }

            function createPlateRow(countInRow, startIndex, posClass) {
                if (countInRow === 0) return;
                const row = document.createElement('div');
                row.className = `row ${posClass}`;
                
                for (let i = 0; i < countInRow; i++) {
                    const idx = startIndex + i;
                    const plate = document.createElement('div');
                    plate.className = 'plate';
                    plate.dataset.index = idx;
                    plate.dataset.hasItem = "false";
                    
                    plate.innerHTML = getPlateSVG();

                    if (settings.plateStyle === 'shadow') {
                        const shadow = document.createElement('div');
                        shadow.className = 'plate-shadow';
                        shadow.innerText = getItemEmoji(currentItemType);
                        plate.appendChild(shadow);
                    }
                    row.appendChild(plate);
                }
                stageArea.appendChild(row);
            }

            // 皿の配置
            if (count <= 5) {
                createPlateRow(topCount, 0, 'pos-2-5');
            } else {
                createPlateRow(topCount, 0, 'pos-1-5');
                createPlateRow(bottomCount, topCount, 'pos-2-5');
            }

            // 果物の配置
            if (settings.itemPosMode === 'ordered') {
                function createItemRow(countInRow, startIndex, posClass) {
                    if (countInRow === 0) return;
                    const row = document.createElement('div');
                    row.className = `row ${posClass}`;
                    
                    for (let i = 0; i < countInRow; i++) {
                        const idx = startIndex + i;
                        const slot = document.createElement('div');
                        slot.className = 'item-slot';
                        slot.dataset.slotIndex = idx;

                        const item = document.createElement('div');
                        item.className = 'item';
                        item.dataset.originalSlot = idx;
                        item.innerText = getItemEmoji(currentItemType);
                        item.addEventListener('pointerdown', handlePointerDown);

                        slot.appendChild(item);
                        row.appendChild(slot);
                    }
                    stageArea.appendChild(row);
                }

                if (count <= 5) {
                    createItemRow(topCount, 0, 'pos-3-5');
                } else {
                    createItemRow(topCount, 0, 'pos-3-5');
                    createItemRow(bottomCount, topCount, 'pos-4-5');
                }
            } else {
                // ランダム配置：Y座標の下限（開始位置）を少し上側（50vh〜82vh）に持ち上げる
                const itemWidthPx = Math.min(window.innerWidth * 0.15, 140);
                const minDistancePx = itemWidthPx * 1.35;
                const placedPositions = [];

                for (let i = 0; i < count; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'item-slot';
                    slot.dataset.slotIndex = i;
                    slot.style.position = 'absolute';
                    slot.style.pointerEvents = 'none';
                    slot.style.visibility = 'hidden';

                    let randX, randY, pxX, pxY;
                    let attempts = 0;
                    let overlap = false;

                    do {
                        overlap = false;
                        randX = 7 + Math.random() * 72;
                        randY = 50 + Math.random() * 32; // 少し上側に調整（50vh〜82vh）

                        pxX = (randX / 100) * window.innerWidth;
                        pxY = (randY / 100) * window.innerHeight;

                        for (let pos of placedPositions) {
                            const dist = Math.hypot(pxX - pos.x, pxY - pos.y);
                            if (dist < minDistancePx) {
                                overlap = true;
                                break;
                            }
                        }
                        attempts++;
                    } while (overlap && attempts < 200);

                    placedPositions.push({ x: pxX, y: pxY });

                    slot.style.left = `${randX}vw`;
                    slot.style.top = `${randY}vh`;

                    const item = document.createElement('div');
                    item.className = 'item';
                    item.dataset.originalSlot = i;
                    item.style.position = 'fixed';
                    item.style.left = `${randX}vw`;
                    item.style.top = `${randY}vh`;
                    item.innerText = getItemEmoji(currentItemType);
                    item.addEventListener('pointerdown', handlePointerDown);

                    stageArea.appendChild(slot);
                    document.body.appendChild(item);
                }
            }

            updatePlateHighlights();
        }

        function handlePointerDown(e) {
            if (activeItem || !e.isPrimary || isClearing) return; 
            e.preventDefault();
            AudioController.init();

            activeItem = e.currentTarget;

            if (activeItem.dataset.snappedPlate) {
                const plate = document.querySelector(`.plate[data-index="${activeItem.dataset.snappedPlate}"]`);
                if (plate) plate.dataset.hasItem = "false";
                activeItem.dataset.snappedPlate = "";
                updatePlateHighlights();
            }

            const rect = activeItem.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;

            const layoutWidth = activeItem.offsetWidth;
            const layoutHeight = activeItem.offsetHeight;
            activeItem.style.width = layoutWidth + 'px';
            activeItem.style.height = layoutHeight + 'px';
            activeItem.style.position = 'fixed';
            activeItem.style.left = rect.left + 'px';
            activeItem.style.top = rect.top + 'px';
            
            activeItem.classList.add('dragging');
            document.body.appendChild(activeItem);

            document.addEventListener('pointermove', handlePointerMove);
            document.addEventListener('pointerup', handlePointerUp);
            document.addEventListener('pointercancel', handlePointerUp);
        }

        function handlePointerMove(e) {
            if (!activeItem || !e.isPrimary) return;
            e.preventDefault();
            const x = e.clientX - offsetX;
            const y = e.clientY - offsetY;
            activeItem.style.left = x + 'px';
            activeItem.style.top = y + 'px';
        }

        function handlePointerUp(e) {
            if (!activeItem || !e.isPrimary) return;
            
            document.removeEventListener('pointermove', handlePointerMove);
            document.removeEventListener('pointerup', handlePointerUp);
            document.removeEventListener('pointercancel', handlePointerUp);

            const itemWidth = activeItem.offsetWidth;
            const itemHeight = activeItem.offsetHeight;
            const itemRect = activeItem.getBoundingClientRect();
            const itemCenterX = itemRect.left + itemRect.width / 2;
            const itemCenterY = itemRect.top + itemRect.height / 2;

            const plates = document.querySelectorAll('.plate');
            let closestPlate = null;
            let minDistance = Infinity;

            let targetIdxNeeded = -1;
            if (settings.orderMode === 'sequential') {
                for (let i = 0; i < plates.length; i++) {
                    const plate = document.querySelector(`.plate[data-index="${i}"]`);
                    if (plate && plate.dataset.hasItem !== "true") {
                        targetIdxNeeded = i;
                        break;
                    }
                }
            }

            for (let plate of plates) {
                if (plate.dataset.hasItem === "true") continue;

                if (settings.orderMode === 'sequential') {
                    if (parseInt(plate.dataset.index) !== targetIdxNeeded) continue;
                }

                const plateRect = plate.getBoundingClientRect();
                const plateCenterX = plateRect.left + plateRect.width / 2;
                const plateCenterY = plateRect.top + plateRect.height / 2;

                const dist = Math.hypot(itemCenterX - plateCenterX, itemCenterY - plateCenterY);
                
                if (dist < plateRect.width / 1.3) {
                    if (dist < minDistance) {
                        minDistance = dist;
                        closestPlate = plate;
                    }
                }
            }

            if (closestPlate) {
                const plateRect = closestPlate.getBoundingClientRect();
                const plateCenterX = plateRect.left + plateRect.width / 2;
                const plateCenterY = plateRect.top + plateRect.height / 2;

                closestPlate.dataset.hasItem = "true";
                activeItem.dataset.snappedPlate = closestPlate.dataset.index;
                
                activeItem.style.transition = 'left 0.2s, top 0.2s';
                activeItem.style.left = (plateCenterX - itemWidth / 2) + 'px';
                /* 配置位置の微調整：皿の高さの2/5 (0.4) だけ上に配置 */
                activeItem.style.top = (plateCenterY - itemHeight / 2 - (plateRect.height * 0.4)) + 'px'; 
                
                AudioController.play('snap');
                updatePlateHighlights();

                const currentItem = activeItem;
                setTimeout(() => {
                    if (currentItem) currentItem.style.transition = '';
                }, 200);
            } else {
                const originalSlotIndex = activeItem.dataset.originalSlot;
                const targetSlot = document.querySelector(`.item-slot[data-slot-index="${originalSlotIndex}"]`);
                
                if (targetSlot) {
                    const slotRect = targetSlot.getBoundingClientRect();
                    activeItem.style.transition = 'left 0.1s ease, top 0.1s ease';
                    activeItem.style.left = slotRect.left + 'px';
                    activeItem.style.top = slotRect.top + 'px';

                    const currentItem = activeItem;
                    setTimeout(() => {
                        if (currentItem && targetSlot) {
                            currentItem.style.transition = '';
                            if (settings.itemPosMode === 'ordered') {
                                currentItem.style.position = 'absolute';
                                currentItem.style.left = '0';
                                currentItem.style.top = '0';
                                currentItem.style.width = '100%';
                                currentItem.style.height = '100%';
                                targetSlot.appendChild(currentItem);
                            }
                        }
                    }, 100);
                }
            }
            
            activeItem.classList.remove('dragging');
            activeItem = null;

            checkClear();
        }

        function checkClear() {
            if (isClearing) return;

            const plates = document.querySelectorAll('.plate');
            let allFilled = true;
            for (let p of plates) {
                if (p.dataset.hasItem !== "true") {
                    allFilled = false;
                    break;
                }
            }

            if (allFilled) {
                isClearing = true;
                document.getElementById('clear-mark').classList.add('show');
                
                if (round >= settings.totalRounds) {
                    AudioController.play('all_clear');
                    setTimeout(() => {
                        returnToHome();
                    }, 2200);
                } else {
                    AudioController.play('clear');
                    round++;
                    setTimeout(() => {
                        updateScoreDisplay();
                        initRound();
                    }, 2000);
                }
            }
        }

        let tapTimes = [];
        document.getElementById('setting-trigger-btn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            const now = Date.now();
            tapTimes.push(now);
            tapTimes = tapTimes.filter(t => now - t <= 600);
            if (tapTimes.length >= 3) {
                tapTimes = [];
                openSettings();
            }
        });

        document.getElementById('btn-select-all').addEventListener('click', () => {
            document.querySelectorAll('input[name="setting-items"]').forEach(cb => cb.checked = true);
            updateSampleView();
        });
        document.getElementById('btn-deselect-all').addEventListener('click', () => {
            const checkboxes = document.querySelectorAll('input[name="setting-items"]');
            checkboxes.forEach((cb, idx) => cb.checked = (idx === 0));
            updateSampleView();
        });

        function updateSampleView() {
            const count = parseInt(slider.value) || 3;
            const style = document.querySelector('input[name="setting-style"]:checked')?.value || 'normal';
            const posMode = document.querySelector('input[name="setting-pos-mode"]:checked')?.value || 'ordered';
            const orderMode = document.querySelector('input[name="setting-order-mode"]:checked')?.value || 'any';
            const checkedBoxes = Array.from(document.querySelectorAll('input[name="setting-items"]:checked')).map(cb => cb.value);
            const sampleType = checkedBoxes.length > 0 ? checkedBoxes[0] : 'apple';

            const sampleStageArea = document.getElementById('sample-stage-area');
            sampleStageArea.innerHTML = '';

            let topCount, bottomCount;
            if (count <= 5) {
                topCount = count;
                bottomCount = 0;
            } else {
                topCount = Math.ceil(count / 2);
                bottomCount = Math.floor(count / 2);
            }

            function createSamplePlateRow(countInRow, posClass, startIndex) {
                if (countInRow === 0) return;
                const row = document.createElement('div');
                row.className = `sample-row ${posClass}`;
                
                for (let i = 0; i < countInRow; i++) {
                    const idx = startIndex + i;
                    const plate = document.createElement('div');
                    plate.className = 'sample-plate';
                    plate.innerHTML = getPlateSVG();

                    if (orderMode === 'sequential') {
                        if (idx === 0) {
                            plate.classList.add('sample-target');
                        } else {
                            plate.classList.add('sample-dimmed');
                        }
                    }

                    if (style === 'shadow') {
                        const shadow = document.createElement('div');
                        shadow.className = 'sample-plate-shadow';
                        shadow.innerText = getItemEmoji(sampleType);
                        plate.appendChild(shadow);
                    }
                    row.appendChild(plate);
                }
                sampleStageArea.appendChild(row);
            }

            if (count <= 5) {
                createSamplePlateRow(topCount, 'sample-pos-2-5', 0);
            } else {
                createSamplePlateRow(topCount, 'sample-pos-1-5', 0);
                createSamplePlateRow(bottomCount, 'sample-pos-2-5', topCount);
            }

            if (posMode === 'ordered') {
                function createSampleItemRow(countInRow, posClass) {
                    if (countInRow === 0) return;
                    const row = document.createElement('div');
                    row.className = `sample-row ${posClass}`;
                    
                    for (let i = 0; i < countInRow; i++) {
                        const slot = document.createElement('div');
                        slot.className = 'sample-item-slot';
                        slot.innerText = getItemEmoji(sampleType);
                        row.appendChild(slot);
                    }
                    sampleStageArea.appendChild(row);
                }

                if (count <= 5) {
                    createSampleItemRow(topCount, 'sample-pos-3-5');
                } else {
                    createSampleItemRow(topCount, 'sample-pos-3-5');
                    createSampleItemRow(bottomCount, 'sample-pos-4-5');
                }
            } else {
                const placedPos = [];
                const minSampleDist = 18;

                for (let i = 0; i < count; i++) {
                    let rx, ry, overlap;
                    let attempts = 0;

                    do {
                        overlap = false;
                        rx = 8 + Math.random() * 70;
                        ry = 50 + Math.random() * 32;

                        for (let p of placedPos) {
                            if (Math.hypot(rx - p.x, ry - p.y) < minSampleDist) {
                                overlap = true;
                                break;
                            }
                        }
                        attempts++;
                    } while (overlap && attempts < 100);

                    placedPos.push({ x: rx, y: ry });

                    const slot = document.createElement('div');
                    slot.className = 'sample-item-slot';
                    slot.style.position = 'absolute';
                    slot.style.left = `${rx}%`;
                    slot.style.top = `${ry}%`;
                    slot.style.transform = 'translate(-50%, -50%)';
                    slot.innerText = getItemEmoji(sampleType);
                    sampleStageArea.appendChild(slot);
                }
            }
        }

        const slider = document.getElementById('setting-count');
        const countDisp = document.getElementById('plate-count-disp');
        const totalRoundsSlider = document.getElementById('setting-total-rounds');
        const totalRoundsDisp = document.getElementById('round-total-disp');

        slider.addEventListener('input', (e) => {
            countDisp.innerText = e.target.value;
            updateSampleView();
        });
        totalRoundsSlider.addEventListener('input', (e) => {
            totalRoundsDisp.innerText = e.target.value;
        });

        document.querySelectorAll('input[name="setting-style"], input[name="setting-items"], input[name="setting-pos-mode"], input[name="setting-order-mode"]').forEach(input => {
            input.addEventListener('change', () => {
                updateSampleView();
            });
        });

        function openSettings() {
            slider.value = settings.plateCount;
            countDisp.innerText = settings.plateCount;
            totalRoundsSlider.value = settings.totalRounds || 5;
            totalRoundsDisp.innerText = settings.totalRounds || 5;
            
            document.querySelector(`input[name="setting-style"][value="${settings.plateStyle}"]`).checked = true;
            document.querySelector(`input[name="setting-sound"][value="${settings.soundType}"]`).checked = true;
            document.querySelector(`input[name="setting-pos-mode"][value="${settings.itemPosMode || 'ordered'}"]`).checked = true;
            document.querySelector(`input[name="setting-order-mode"][value="${settings.orderMode || 'any'}"]`).checked = true;

            const checkboxes = document.querySelectorAll('input[name="setting-items"]');
            checkboxes.forEach(cb => {
                cb.checked = settings.selectedItems.includes(cb.value);
            });

            document.getElementById('settings-modal').classList.remove('hidden');
            updateSampleView();
        }

        document.getElementById('close-settings-btn').addEventListener('click', () => {
            settings.plateCount = parseInt(slider.value);
            settings.totalRounds = parseInt(totalRoundsSlider.value);
            settings.plateStyle = document.querySelector('input[name="setting-style"]:checked').value;
            settings.soundType = document.querySelector('input[name="setting-sound"]:checked').value;
            settings.itemPosMode = document.querySelector('input[name="setting-pos-mode"]:checked').value;
            settings.orderMode = document.querySelector('input[name="setting-order-mode"]:checked').value;

            const checkedBoxes = Array.from(document.querySelectorAll('input[name="setting-items"]:checked')).map(cb => cb.value);
            settings.selectedItems = checkedBoxes.length > 0 ? checkedBoxes : ['apple'];

            localStorage.setItem('1to1Settings', JSON.stringify(settings));
            document.getElementById('settings-modal').classList.add('hidden');
            
            if (!document.getElementById('play-screen').classList.contains('hidden')) {
                updateScoreDisplay();
                initRound();
            }
        });

        document.getElementById('start-btn').addEventListener('click', startGame);

    </script>
